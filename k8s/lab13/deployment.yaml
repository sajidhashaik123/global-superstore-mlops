
apiVersion: apps/v1
kind: Deployment

metadata:
  name: global-superstore-lab13
  namespace: default

spec:
  replicas: 1

  selector:
    matchLabels:
      app: global-superstore-lab13

  template:
    metadata:
      labels:
        app: global-superstore-lab13

    spec:
      containers:
        - name: mlops-api
          image: global-superstore-mlops-e2e:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          env:
            - name: LAB13_MODEL_VERSION
              value: "lab7-v1"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20

          volumeMounts:
            - name: lab13-logs
              mountPath: /app/reports/lab13/logs

      volumes:
        - name: lab13-logs
          persistentVolumeClaim:
            claimName: global-superstore-lab13-logs-pvc
